spring.application.name=demo
server.port=7777

# Server configuration
#server.port=8080

# Actuator configuration
management.endpoints.web.exposure.include=health,info,metrics,custom
management.endpoint.health.show-details=always
management.info.env.enabled=true
management.endpoints.web.base-path=/actuator
management.endpoints.enabled-by-default=true

# Enable custom endpoints
management.endpoint.custom.enabled=true

# Add custom info
info.app.name=Simple Actuator Demo
info.app.description=A simple Spring Boot application with Actuator
info.app.version=1.0.0
info.java.version=${java.version}

# ===============================
# DATABASE CONFIGURATION
# ===============================
# Replace with your PostgreSQL connection details
spring.datasource.url=jdbc:postgresql://localhost:5432/your_database_name
spring.datasource.username=your_db_user
spring.datasource.password=your_db_password
# Specify the PostgreSQL driver
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA/HIBERNATE CONFIGURATION
# ===============================
# Show SQL statements generated by Hibernate (optional, useful for debugging)
spring.jpa.show-sql=true
# Hibernate dialect for PostgreSQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Hibernate ddl-auto strategy:
# 'validate': validate the schema, makes no changes to the database.
# 'update': update the schema.
# 'create': creates the schema, destroying previous data.
# 'create-drop': drops the schema when the SessionFactory is closed, typically when the application ends.
# 'none': disable DDL handling.
# IMPORTANT: For production, 'validate' or 'none' is recommended when using Flyway.
# Flyway should be solely responsible for schema changes.
spring.jpa.hibernate.ddl-auto=validate

# ===============================
# FLYWAY CONFIGURATION
# ===============================
# Enable Flyway (true by default, but explicit is good)

spring.flyway.enabled=true
spring.flyway.placeholders.csv.seed.file.path=/absolute/path/on/db/server/persons_seed.csv


# Location of the migration scripts (default is classpath:db/migration)
# spring.flyway.locations=classpath:db/migration

# Optional: Specify the schema Flyway should manage (defaults to 'public' for PostgreSQL)
# spring.flyway.schemas=public

# Optional: Set baseline version if integrating Flyway into an existing database
# spring.flyway.baseline-on-migrate=true
# spring.flyway.baseline-version=0

# Optional: Clean the database schema before migration (useful for testing, DANGEROUS in production)
# spring.flyway.clean-disabled=false # Set to true in production!
# spring.flyway.clean-on-validation-error=false # Set to true in production!


